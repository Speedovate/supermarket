<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shop groceries for pickup or delivery from Andrew's Supermarket.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Andrew's Supermarket | Grocery Pickup & Delivery">
  <meta property="og:description" content="Shop groceries for pickup or delivery from Andrew's Supermarket.">
  <meta property="og:image" content="/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://andrewssupermarket.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Andrew's Supermarket | Grocery Pickup & Delivery">
  <meta name="twitter:description" content="Shop groceries for pickup or delivery from Andrew's Supermarket.">
  <meta name="twitter:image" content="/social-preview.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Andrew's Supermarket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Andrew's Supermarket</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --startup-logo-width: 200px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overscroll-behavior-x: none;
      background: #2F3DBF;
    }

    body {
      overflow: hidden;
    }

    #app-startup-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2F3DBF;
      z-index: 9999;
    }

    #app-startup-splash__content {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 20px;
      box-sizing: border-box;
    }

    #app-startup-splash__logo {
      width: var(--startup-logo-width);
      height: auto;
      display: block;
      image-rendering: auto;
    }

    #app-startup-splash__logo-wrap {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 0;
      bottom: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app-startup-splash__footer {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 36px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    #app-startup-splash__footer img {
      width: var(--startup-logo-width);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div id="app-startup-splash" aria-label="Loading Andrew's Supermarket">
    <div id="app-startup-splash__content">
      <div id="app-startup-splash__logo-wrap">
        <img
          id="app-startup-splash__logo"
          src="assets/assets/branding/as_logo_lite.png"
          alt="Andrew's Supermarket"
        >
      </div>
      <div id="app-startup-splash__footer" aria-hidden="true">
        <img src="assets/assets/branding/sdv_footer_lite.png" alt="">
      </div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
