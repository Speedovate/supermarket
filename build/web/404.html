<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Andrew's Supermarket">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Andrew's Supermarket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Andrew's Supermarket</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overscroll-behavior-x: none;
      background: #ffffff;
    }

    body {
      overflow: hidden;
    }

    #app-startup-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    }

    #app-startup-splash img {
      width: min(180px, 42vw);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div id="app-startup-splash" aria-label="Loading Andrew's Supermarket">
    <img src="icons/Icon-192.png" alt="Andrew's Supermarket">
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
