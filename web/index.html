<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <meta name="description" content="Shop groceries from Andrew's Supermarket and order now.">
  <meta name="theme-color" content="#2F3DBF">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Andrew's Supermarket | Order Now!">
  <meta property="og:description" content="Shop groceries from Andrew's Supermarket and order now.">
  <meta property="og:image" content="/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://andrewssupermarket.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Andrew's Supermarket | Order Now!">
  <meta name="twitter:description" content="Shop groceries from Andrew's Supermarket and order now.">
  <meta name="twitter:image" content="/social-preview.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Andrew's Supermarket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Andrew's Supermarket</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --startup-logo-width: 180px;
    }

    @media (max-width: 640px) {
      :root {
        --startup-logo-width: 120px;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overscroll-behavior-x: none;
      background: #FFFFFF;
    }

    body {
      overflow: hidden;
    }

    body,
    flt-glass-pane,
    flt-scene-host,
    flt-semantics-host,
    flt-semantics,
    [flt-semantics-identifier] {
      -webkit-user-select: text;
      user-select: text;
    }

    #app-startup-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2F3DBF;
      z-index: 9999;
    }

    #app-startup-splash__content {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 20px;
      box-sizing: border-box;
    }

    #app-startup-splash__logo {
      width: var(--startup-logo-width);
      height: auto;
      display: block;
      image-rendering: auto;
      padding-right: 25px;
      box-sizing: content-box;
    }

    #app-startup-splash__logo-wrap {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 0;
      bottom: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app-startup-splash__footer {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 36px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    #app-startup-splash__footer img {
      width: var(--startup-logo-width);
      height: auto;
      display: block;
    }

    #social-browser-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: rgba(16, 24, 40, 0.72);
      backdrop-filter: blur(4px);
    }

    #social-browser-overlay[data-visible="true"] {
      display: flex;
    }

    #social-browser-overlay__card {
      width: min(100%, 420px);
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 0 24px 64px rgba(16, 24, 40, 0.20);
      font-family: Arial, sans-serif;
      color: #101828;
    }

    #social-browser-overlay__title {
      margin: 0;
      color: #2F3DBF;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
    }

    #social-browser-overlay__message {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.4;
    }

    #social-browser-overlay__actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .social-browser-overlay__button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      min-height: 50px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.15;
      cursor: pointer;
    }

    .social-browser-overlay__button--primary {
      background: #2F3DBF;
      color: #FFFFFF;
    }

    .social-browser-overlay__button--secondary {
      background: #F2F4F7;
      color: #344054;
    }
  </style>
</head>
<body>
  <div id="app-startup-splash" aria-label="Loading Andrew's Supermarket">
    <div id="app-startup-splash__content">
      <div id="app-startup-splash__logo-wrap">
        <img
          id="app-startup-splash__logo"
          src="assets/assets/branding/as_logo_lite.png"
          alt="Andrew's Supermarket"
        >
      </div>
      <div id="app-startup-splash__footer" aria-hidden="true">
        <img src="assets/assets/branding/sdv_footer_lite.png" alt="">
      </div>
    </div>
  </div>
  <div id="social-browser-overlay" aria-hidden="true">
    <div id="social-browser-overlay__card" role="dialog" aria-modal="true" aria-labelledby="social-browser-overlay__title">
      <h1 id="social-browser-overlay__title">Open In Chrome</h1>
      <p id="social-browser-overlay__message">
        This website may not render correctly inside social media browsers. Open it in Chrome for the best experience.
      </p>
      <div id="social-browser-overlay__actions">
        <button
          id="social-browser-open-chrome"
          class="social-browser-overlay__button social-browser-overlay__button--primary"
          type="button"
        >
          Open in Chrome
        </button>
        <button
          id="social-browser-continue"
          class="social-browser-overlay__button social-browser-overlay__button--secondary"
          type="button"
        >
          Continue Here
        </button>
      </div>
      <p id="social-browser-overlay__message">
        If Chrome does not open automatically, tap your browser menu and choose “Open in browser”.
      </p>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      const userAgent = navigator.userAgent || '';
      const socialBrowserPattern =
        /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line|MicroMessenger|WeChat|Twitter|Telegram|Viber|Snapchat|LinkedInApp|Pinterest|wv\)|; wv|TikTok/i;
      const isSocialInAppBrowser = socialBrowserPattern.test(userAgent);
      const splashThemeColor = '#2F3DBF';
      const adminThemeColor = '#2F3DBF';
      const clientThemeColor = '#FFFFFF';
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');
      const socialOverlay = document.getElementById('social-browser-overlay');
      const openChromeButton = document.getElementById('social-browser-open-chrome');
      const continueButton = document.getElementById('social-browser-continue');

      function currentAbsoluteUrl() {
        return window.location.origin +
          window.location.pathname +
          window.location.search +
          window.location.hash;
      }

      function hideSocialOverlay() {
        if (!socialOverlay) {
          return;
        }
        socialOverlay.setAttribute('aria-hidden', 'true');
        socialOverlay.dataset.visible = 'false';
      }

      function showSocialOverlay() {
        if (!socialOverlay) {
          return;
        }
        socialOverlay.setAttribute('aria-hidden', 'false');
        socialOverlay.dataset.visible = 'true';
      }

      function openInChrome() {
        const targetUrl = currentAbsoluteUrl();
        const isAndroid = /Android/i.test(userAgent);
        const isIos = /iPhone|iPad|iPod/i.test(userAgent);

        if (isAndroid) {
          const intentUrl =
            'intent://' +
            targetUrl.replace(/^https?:\/\//i, '') +
            '#Intent;scheme=https;package=com.android.chrome;end';
          window.location.href = intentUrl;
          return;
        }

        if (isIos) {
          const chromeUrl = targetUrl.replace(/^http:\/\//i, 'googlechrome://')
            .replace(/^https:\/\//i, 'googlechromes://');
          window.location.href = chromeUrl;
          window.setTimeout(() => {
            window.location.href = targetUrl;
          }, 900);
          return;
        }

        window.open(targetUrl, '_blank', 'noopener,noreferrer');
      }

      function isSplashVisible() {
        return Boolean(document.getElementById('app-startup-splash'));
      }

      function syncThemeColor() {
        if (!themeColorMeta) {
          return;
        }
        const isAdmin = window.location.pathname.startsWith('/admin');
        themeColorMeta.setAttribute(
          'content',
          isSplashVisible()
            ? splashThemeColor
            : (isAdmin ? adminThemeColor : clientThemeColor),
        );
      }

      window.__syncThemeColor = syncThemeColor;

      const originalPushState = history.pushState;
      history.pushState = function () {
        const result = originalPushState.apply(this, arguments);
        syncThemeColor();
        return result;
      };

      const originalReplaceState = history.replaceState;
      history.replaceState = function () {
        const result = originalReplaceState.apply(this, arguments);
        syncThemeColor();
        return result;
      };

      window.addEventListener('popstate', syncThemeColor);
      if (isSocialInAppBrowser) {
        showSocialOverlay();
        window.__socialInAppBrowserDetected = true;
      }
      if (openChromeButton) {
        openChromeButton.addEventListener('click', openInChrome);
      }
      if (continueButton) {
        continueButton.addEventListener('click', hideSocialOverlay);
      }
      syncThemeColor();
    })();
  </script>
</body>
</html>
